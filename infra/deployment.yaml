projects:
  - name: cv-rag
    environments:
      # ============================================
      # Production Environment (branch: main)
      # ============================================
      - name: production
        services:
          # Web App (FastAPI with Docker)
          - type: web
            runtime: docker
            name: hr-resume-agent
            rootDir: ./
            dockerfilePath: ./Dockerfile
            dockerContext: ./
            numInstances: 1
            region: frankfurt
            plan: starter
            branch: 1.0.0_dev
            autoDeploy: true
            maxShutdownDelaySeconds: 120
            healthCheckPath: /
            envVars:
              - fromGroup: cv-rag-env
