# Build (on dev) or promote (to stag/prod), then open a deploy PR in
# two-steps-org/de-hostinger-infra bumping <env>/cv-rag/deployment.yaml.
# Merging that PR triggers the Hostinger deploy over there.
#
# Branch model (branch protection enforced separately on GitHub):
#   - You push only to `dev`         → builds a fresh timestamped image.
#   - `dev → stag` / `dev → prod` PRs → merging them pushes stag/prod, which
#                                        PROMOTES the image dev currently runs
#                                        (same artifact, no rebuild).
#   - `1.0.0_dev` is the default/integration branch and does NOT deploy.
name: Build & request deploy

on:
  push:
    branches: [dev, stag, prod]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [dev, stag, prod]
        default: dev

concurrency:
  group: build-cv-rag-${{ github.event.inputs.environment || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/two-steps-org/twosteps.cv-rag
  INFRA_REPO: two-steps-org/de-hostinger-infra

jobs:
  build-or-promote:
    name: Build (dev) or promote (stag/prod), open deploy PR
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          else
            ENV="${{ github.ref_name }}"   # dev | stag | prod
          fi
          echo "name=$ENV" >> "$GITHUB_OUTPUT"
          echo "file=$ENV/cv-rag/deployment.yaml" >> "$GITHUB_OUTPUT"
          echo "Environment: $ENV"

      # App source (this repo) — needed only when we build (dev).
      - name: Checkout app source
        uses: actions/checkout@v4

      # Deploy repo — always needed: to read dev's current tag (promotion) and
      # to bump the target env's deployment.yaml + open the PR.
      - name: Checkout deploy repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ steps.env.outputs.name }}" = "dev" ]; then
            # dev builds a new immutable timestamp tag.
            echo "value=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building new image."
          else
            # stag/prod promote whatever dev currently runs — the same artifact.
            SRC="infra/dev/cv-rag/deployment.yaml"
            TAG=$(grep -m1 'image:' "$SRC" | sed -E 's/.*:([A-Za-z0-9._-]+)[[:space:]]*$/\1/')
            if [ -z "$TAG" ]; then
              echo "::error::Could not read the current dev image tag from $SRC"; exit 1
            fi
            echo "value=$TAG" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Promoting dev image: $TAG"
          fi

      - name: Set up Docker Buildx
        if: steps.tag.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.tag.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN works only if this repo has Write on the twosteps.cv-rag
          # package; otherwise GHCR_PUSH_TOKEN is a PAT with write:packages.
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.tag.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Bump image tag in the target environment
        run: |
          F="infra/${{ steps.env.outputs.file }}"
          if [ ! -f "$F" ]; then
            echo "::error::$F does not exist in ${{ env.INFRA_REPO }} — set up the '${{ steps.env.outputs.name }}' environment there first."
            exit 1
          fi
          sed -i -E "s|(image: ${{ env.IMAGE }}):.*|\1:${{ steps.tag.outputs.value }}|" "$F"
          grep -q "image: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}" "$F" \
            || { echo "::error::Failed to set image tag in $F"; exit 1; }
          grep 'image:' "$F"

      - name: Open deploy PR
        uses: peter-evans/create-pull-request@v6
        with:
          path: infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          branch: deploy/cv-rag-${{ steps.env.outputs.name }}-${{ steps.tag.outputs.value }}
          base: main
          commit-message: "deploy(cv-rag/${{ steps.env.outputs.name }}): ${{ steps.tag.outputs.value }}"
          title: "deploy(cv-rag/${{ steps.env.outputs.name }}): ${{ steps.tag.outputs.value }}"
          body: |
            ${{ steps.tag.outputs.build == 'true' && 'Built' || 'Promoted (same image as dev)' }} → **${{ steps.env.outputs.name }}**: `${{ steps.tag.outputs.value }}`

            - image: `${{ env.IMAGE }}:${{ steps.tag.outputs.value }}`
            - trigger: `${{ steps.env.outputs.name }}` @ ${{ github.sha }}

            Merging deploys to Hostinger via `deploy-cv-rag-${{ steps.env.outputs.name }}.yml`.
