# Build the cv-rag image, push it to GHCR with a timestamp tag, and open a PR in
# the deploy repo (two-steps-org/de-hostinger-infra) bumping the image tag in
# dev/cv-rag/deployment.yaml. Merging that PR triggers the actual Hostinger
# deploy over there. This repo builds; the deploy repo deploys.
name: Build & request deploy

on:
  push:
    branches: ["dev,stag,prod"]
    paths:
      - "app/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-and-deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: build-cv-rag
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/two-steps-org/twosteps.cv-rag
  INFRA_REPO: two-steps-org/de-hostinger-infra
  DEPLOY_FILE: dev/cv-rag/deployment.yaml

jobs:
  build-and-request:
    name: Build, push, open deploy PR
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout app source
        uses: actions/checkout@v4

      - name: Compute image tag (UTC build timestamp)
        id: tag
        run: echo "ts=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN can push here ONLY if this repo has Write access to the
          # twosteps.cv-rag package (Package settings → Manage Actions access →
          # add two-steps-org/cv-rag = Write). Otherwise set GHCR_PUSH_TOKEN to a
          # PAT with write:packages and use it here instead.
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Immutable tags only. No `latest`, no moving pointer — the deploy repo
          # pins to the exact timestamp via the PR this job opens.
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.ts }}
            ${{ env.IMAGE }}:${{ github.sha }}

      # Check out the deploy repo and bump the image tag in dev/cv-rag/deployment.yaml.
      - name: Checkout deploy repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Bump image tag
        run: |
          F="infra/${{ env.DEPLOY_FILE }}"
          sed -i -E "s|(image: ${{ env.IMAGE }}):.*|\1:${{ steps.tag.outputs.ts }}|" "$F"
          grep -q "image: ${{ env.IMAGE }}:${{ steps.tag.outputs.ts }}" "$F" \
            || { echo "::error::Failed to bump image tag in $F"; exit 1; }
          grep 'image:' "$F"

      - name: Open deploy PR
        uses: peter-evans/create-pull-request@v6
        with:
          path: infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          branch: deploy/cv-rag-${{ steps.tag.outputs.ts }}
          base: main
          commit-message: "deploy(cv-rag): ${{ steps.tag.outputs.ts }}"
          title: "deploy(cv-rag): ${{ steps.tag.outputs.ts }}"
          body: |
            Bump cv-rag (dev) image to `${{ steps.tag.outputs.ts }}`.

            - image: `${{ env.IMAGE }}:${{ steps.tag.outputs.ts }}`
            - source commit: ${{ github.sha }}

            Merging this deploys to Hostinger via `deploy-cv-rag.yml`.
