# Build the cv-rag image, push it to GHCR with a timestamp tag, and open a PR in
# the deploy repo (two-steps-org/de-hostinger-infra) bumping the image tag in
# <env>/cv-rag/deployment.yaml. Merging that PR triggers the actual Hostinger
# deploy over there. This repo builds; the deploy repo deploys.
#
# Branch = environment: push to `dev`, `stag`, or `prod` deploys to that env.
# `1.0.0_dev` is the default/integration branch and does NOT deploy.
name: Build & request deploy

on:
  push:
    branches: [dev, stag, prod]
    paths:
      - "app/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-and-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [dev, stag, prod]
        default: dev

concurrency:
  # One in-flight build per environment.
  group: build-cv-rag-${{ github.event.inputs.environment || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/two-steps-org/twosteps.cv-rag
  INFRA_REPO: two-steps-org/de-hostinger-infra

jobs:
  build-and-request:
    name: Build, push, open deploy PR
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          else
            ENV="${{ github.ref_name }}"   # dev | stag | prod
          fi
          echo "name=$ENV" >> "$GITHUB_OUTPUT"
          echo "file=$ENV/cv-rag/deployment.yaml" >> "$GITHUB_OUTPUT"
          echo "Building for environment: $ENV"

      - name: Checkout app source
        uses: actions/checkout@v4

      - name: Compute image tag (UTC build timestamp)
        id: tag
        run: echo "ts=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN can push here ONLY if this repo has Write access to the
          # twosteps.cv-rag package (Package settings → Manage Actions access →
          # add two-steps-org/cv-rag = Write). Otherwise GHCR_PUSH_TOKEN is a PAT
          # with write:packages.
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Immutable tags only. No `latest`, no moving pointer — the deploy repo
          # pins to the exact timestamp via the PR this job opens.
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.ts }}
            ${{ env.IMAGE }}:${{ github.sha }}

      # Check out the deploy repo and bump the tag in <env>/cv-rag/deployment.yaml.
      - name: Checkout deploy repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Bump image tag
        run: |
          F="infra/${{ steps.env.outputs.file }}"
          if [ ! -f "$F" ]; then
            echo "::error::$F does not exist in ${{ env.INFRA_REPO }} — set up the '${{ steps.env.outputs.name }}' environment there first."
            exit 1
          fi
          sed -i -E "s|(image: ${{ env.IMAGE }}):.*|\1:${{ steps.tag.outputs.ts }}|" "$F"
          grep -q "image: ${{ env.IMAGE }}:${{ steps.tag.outputs.ts }}" "$F" \
            || { echo "::error::Failed to bump image tag in $F"; exit 1; }
          grep 'image:' "$F"

      - name: Open deploy PR
        uses: peter-evans/create-pull-request@v6
        with:
          path: infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          branch: deploy/cv-rag-${{ steps.env.outputs.name }}-${{ steps.tag.outputs.ts }}
          base: main
          commit-message: "deploy(cv-rag/${{ steps.env.outputs.name }}): ${{ steps.tag.outputs.ts }}"
          title: "deploy(cv-rag/${{ steps.env.outputs.name }}): ${{ steps.tag.outputs.ts }}"
          body: |
            Bump cv-rag **${{ steps.env.outputs.name }}** image to `${{ steps.tag.outputs.ts }}`.

            - image: `${{ env.IMAGE }}:${{ steps.tag.outputs.ts }}`
            - source: `${{ steps.env.outputs.name }}` @ ${{ github.sha }}

            Merging deploys to Hostinger via `deploy-cv-rag-${{ steps.env.outputs.name }}.yml`.
